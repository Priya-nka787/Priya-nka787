<svg
  width="950"
  height="190"
  viewBox="0 0 950 190"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Blue glow -->
    <filter id="blueGlow"
            x="-30%" y="-30%"
            width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pink glow -->
    <filter id="pinkGlow"
            x="-30%" y="-30%"
            width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Purple glow -->
    <filter id="purpleGlow"
            x="-30%" y="-30%"
            width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- DARK BACKGROUND -->
  <!-- ================================================= -->

  <rect
    x="24"
    y="28"
    width="902"
    height="140"
    rx="5"
    fill="#0D1117"
  />


  <!-- ================================================= -->
  <!-- MAIN BLUE RECTANGLE -->
  <!-- ================================================= -->

  <rect
    x="34"
    y="39"
    width="882"
    height="118"
    rx="3"
    fill="none"
    stroke="#00AFFF"
    stroke-width="2"
    filter="url(#blueGlow)"
  />

  <rect
    x="38"
    y="43"
    width="874"
    height="110"
    rx="2"
    fill="none"
    stroke="#0066FF"
    stroke-width="0.8"
    opacity="0.45"
  />


  <!-- ================================================= -->
  <!-- PINK RECTANGLE - TILTED CLOCKWISE -->
  <!-- ================================================= -->

  <g transform="rotate(2.8 475 95)">

    <rect
      x="43"
      y="35"
      width="864"
      height="116"
      rx="3"
      fill="none"
      stroke="#FF28C8"
      stroke-width="2"
      filter="url(#pinkGlow)"
    />

    <rect
      x="47"
      y="39"
      width="856"
      height="108"
      rx="2"
      fill="none"
      stroke="#FF28C8"
      stroke-width="0.7"
      opacity="0.4"
    />

  </g>


  <!-- ================================================= -->
  <!-- THIRD RECTANGLE - OPPOSITE TILT -->
  <!-- ================================================= -->

  <g transform="rotate(-2.5 475 95)">

    <rect
      x="50"
      y="42"
      width="850"
      height="108"
      rx="3"
      fill="none"
      stroke="#9B5CFF"
      stroke-width="1.8"
      filter="url(#purpleGlow)"
      opacity="0.95"
    />

    <rect
      x="54"
      y="46"
      width="842"
      height="100"
      rx="2"
      fill="none"
      stroke="#7A3CFF"
      stroke-width="0.6"
      opacity="0.35"
    />

  </g>


  <!-- ================================================= -->
  <!-- SKILL BADGE STYLE -->
  <!-- ================================================= -->

  <!-- C -->

  <rect
    x="62"
    y="62"
    width="97"
    height="34"
    rx="7"
    fill="#090D12"
    stroke="#168CFF"
    stroke-width="1.5"
  />

  <text
    x="110.5"
    y="85"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#FFFFFF"
  >
    C
  </text>


  <!-- C++ -->

  <rect
    x="168"
    y="62"
    width="101"
    height="34"
    rx="7"
    fill="#090D12"
    stroke="#3B78FF"
    stroke-width="1.5"
  />

  <text
    x="218.5"
    y="85"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#FFFFFF"
  >
    C++
  </text>


  <!-- JAVA -->

  <rect
    x="278"
    y="62"
    width="102"
    height="34"
    rx="7"
    fill="#090D12"
    stroke="#FF7900"
    stroke-width="1.5"
  />

  <text
    x="329"
    y="85"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#FFFFFF"
  >
    JAVA
  </text>


  <!-- PYTHON -->

  <rect
    x="389"
    y="62"
    width="116"
    height="34"
    rx="7"
    fill="#090D12"
    stroke="#FFD600"
    stroke-width="1.5"
  />

  <text
    x="447"
    y="85"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#FFFFFF"
  >
    PYTHON
  </text>


  <!-- JAVASCRIPT -->

  <rect
    x="514"
    y="62"
    width="139"
    height="34"
    rx="7"
    fill="#090D12"
    stroke="#FFE000"
    stroke-width="1.5"
  />

  <text
    x="583.5"
    y="85"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    fill="#FFFFFF"
  >
    JAVASCRIPT
  </text>


  <!-- TYPESCRIPT -->

  <rect
    x="662"
    y="62"
    width="125"
    height="34"
    rx="7"
    fill="#090D12"
    stroke="#00D9FF"
    stroke-width="1.5"
  />

  <text
    x="724.5"
    y="85"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    fill="#FFFFFF"
  >
    TYPESCRIPT
  </text>


  <!-- HTML5 -->

  <rect
    x="220"
    y="110"
    width="111"
    height="34"
    rx="7"
    fill="#090D12"
    stroke="#FF5C00"
    stroke-width="1.5"
  />

  <text
    x="275.5"
    y="133"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    fill="#FFFFFF"
  >
    HTML5
  </text>


  <!-- CSS3 -->

  <rect
    x="345"
    y="110"
    width="101"
    height="34"
    rx="7"
    fill="#090D12"
    stroke="#00D9FF"
    stroke-width="1.5"
  />

  <text
    x="395.5"
    y="133"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    fill="#FFFFFF"
  >
    CSS3
  </text>

</svg>
