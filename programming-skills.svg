<svg width="1000" height="190" viewBox="0 0 1000 190"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- BLUE NEON GLOW -->
    <filter id="blueGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- PINK NEON GLOW -->
    <filter id="pinkGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- DARK BACKGROUND -->
    <linearGradient id="dark"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#080A12"/>
      <stop offset="100%" stop-color="#020307"/>
    </linearGradient>

  </defs>


  <!-- DARK TRANSPARENT PANEL -->

  <rect
      x="45"
      y="25"
      width="910"
      height="140"
      rx="6"
      fill="url(#dark)"
      opacity="0.94"/>


  <!-- THIN BLUE FRAME -->

  <rect
      x="55"
      y="35"
      width="890"
      height="120"
      rx="4"
      fill="none"
      stroke="#4DA6FF"
      stroke-width="2"
      filter="url(#blueGlow)"/>


  <!-- THIN PINK ROTATED FRAME -->

  <g transform="rotate(2.5 500 95)">

    <rect
        x="65"
        y="38"
        width="870"
        height="115"
        rx="4"
        fill="none"
        stroke="#FF3DBB"
        stroke-width="2"
        filter="url(#pinkGlow)"/>

  </g>


  <!-- ========================= -->
  <!-- PROGRAMMING BADGES        -->
  <!-- ========================= -->


  <!-- C -->

  <rect
      x="85"
      y="55"
      width="100"
      height="35"
      rx="7"
      fill="#080808"
      stroke="#4DA6FF"
      stroke-width="1.5"/>

  <text
      x="135"
      y="79"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Arial"
      font-size="17"
      font-weight="bold">
      C
  </text>


  <!-- C++ -->

  <rect
      x="195"
      y="55"
      width="105"
      height="35"
      rx="7"
      fill="#080808"
      stroke="#4D7CFF"
      stroke-width="1.5"/>

  <text
      x="247"
      y="79"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Arial"
      font-size="17"
      font-weight="bold">
      C++
  </text>


  <!-- JAVA -->

  <rect
      x="310"
      y="55"
      width="105"
      height="35"
      rx="7"
      fill="#080808"
      stroke="#FF6A00"
      stroke-width="1.5"/>

  <text
      x="362"
      y="79"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Arial"
      font-size="17"
      font-weight="bold">
      JAVA
  </text>


  <!-- PYTHON -->

  <rect
      x="425"
      y="55"
      width="120"
      height="35"
      rx="7"
      fill="#080808"
      stroke="#FFD21F"
      stroke-width="1.5"/>

  <text
      x="485"
      y="79"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Arial"
      font-size="17"
      font-weight="bold">
      PYTHON
  </text>


  <!-- JAVASCRIPT -->

  <rect
      x="555"
      y="55"
      width="145"
      height="35"
      rx="7"
      fill="#080808"
      stroke="#FFE600"
      stroke-width="1.5"/>

  <text
      x="627"
      y="79"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Arial"
      font-size="16"
      font-weight="bold">
      JAVASCRIPT
  </text>


  <!-- TYPESCRIPT -->

  <rect
      x="710"
      y="55"
      width="130"
      height="35"
      rx="7"
      fill="#080808"
      stroke="#00BFFF"
      stroke-width="1.5"/>

  <text
      x="775"
      y="79"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Arial"
      font-size="16"
      font-weight="bold">
      TYPESCRIPT
  </text>


  <!-- HTML5 -->

  <rect
      x="250"
      y="105"
      width="115"
      height="35"
      rx="7"
      fill="#080808"
      stroke="#FF4B00"
      stroke-width="1.5"/>

  <text
      x="307"
      y="129"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Arial"
      font-size="16"
      font-weight="bold">
      HTML5
  </text>


  <!-- CSS3 -->

  <rect
      x="380"
      y="105"
      width="105"
      height="35"
      rx="7"
      fill="#080808"
      stroke="#00BFFF"
      stroke-width="1.5"/>

  <text
      x="432"
      y="129"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Arial"
      font-size="16"
      font-weight="bold">
      CSS3
  </text>

</svg>
